<div class="confirm-overlay" *ngIf="visible" (click)="onBackdropClick()">
  <div class="confirm-dialog" [class.danger]="type === 'danger'" [class.warning]="type === 'warning'" [class.info]="type === 'info'" (click)="$event.stopPropagation()">

    <!-- Icon -->
    <div class="confirm-icon-wrap">
      <div class="confirm-icon" *ngIf="type === 'danger'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <div class="confirm-icon" *ngIf="type === 'warning'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div class="confirm-icon" *ngIf="type === 'info'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
    </div>

    <!-- Content -->
    <h3 class="confirm-title">{{ title }}</h3>
    <p class="confirm-message">{{ message }}</p>

    <!-- Actions -->
    <div class="confirm-actions">
      <button *ngIf="!alertOnly" class="btn-cancel" (click)="onCancel()">{{ cancelText }}</button>
      <button class="btn-confirm" [class.btn-danger]="type === 'danger'" [class.btn-warning]="type === 'warning'" [class.btn-info]="type === 'info'" (click)="onConfirm()">
        {{ alertOnly ? 'Compris' : confirmText }}
      </button>
    </div>
  </div>
</div>
