<div class="layout-root">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Background orbs -->
    <div class="sidebar-orb orb-1"></div>
    <div class="sidebar-orb orb-2"></div>

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo-wrap">
        <ng-container *ngIf="userPhotoUrl; else sidebarInitials">
  <img [src]="userPhotoUrl" alt="Photo utilisateur" class="logo user-photo" />
</ng-container>
<ng-template #sidebarInitials>
  <div class="logo user-photo-fallback">{{ userInitials }}</div>
</ng-template>
        <div class="brand-pulse"></div>
      </div>

      <div class="brand-text">
        <span class="brand-name">{{ userDisplayName }}</span>
        <span class="brand-role">{{ userRoleLabel }}</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="sidebar-divider"></div>

    <!-- Navigation -->
    <nav class="nav" *ngIf="navSections.length; else emptyMenu">

      <ng-container *ngFor="let section of navSections">

    <a
      *ngFor="let item of section.items"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
      </span>

      <span class="nav-label">{{ item.label }}</span>

      <span class="item-badge" *ngIf="item.badge">
        {{ item.badge }}
      </span>

      <span class="nav-arrow">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
    </a>

  </ng-container>

    </nav>

    <!-- Empty menu -->
    <ng-template #emptyMenu>
      <div class="empty-menu">Menu vide</div>
    </ng-template>

    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-status">
        <span class="status-dot"></span>
      </div>
    </div>

  </aside>


  <!-- MAIN -->
  <div class="main-area">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-left">
        <div class="topbar-brand">
          <img src="etap-logo.png" alt="Logo ETAP" class="topbar-logo" />
          <div class="topbar-title">Consotracker</div>
        </div>

        <div class="user-chip">
          <div class="user-avatar">
            {{ userDisplayName.charAt(0) }}
          </div>

          <span class="user-name">
            {{ userDisplayName }}
          </span>

          <span class="user-role">
            {{ userRoleLabel }}
          </span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="top-actions">

        <!-- Notifications -->
        <button class="action-btn notif-btn" (click)="toggleNotifications()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>

          <span class="notif-badge" *ngIf="notifCount">
            {{ notifCount }}
          </span>
        </button>

        <!-- PANEL -->
        <div class="notif-panel" *ngIf="notificationsOpen">

          <div class="notif-header">Notifications</div>

          <div *ngIf="notificationsLoading" class="notif-loading">
            Chargement...
          </div>

          <div *ngIf="!notificationsLoading && notifications.length === 0" class="notif-empty">
            Vide
          </div>

          <div *ngIf="!notificationsLoading && notifications.length > 0" class="notif-list">

            <div
              class="notif-item"
              *ngFor="let n of notifications"
              (click)="onNotificationClick(n)"
            >
              <div class="notif-title">
                {{ notificationLabel(n) }}
              </div>

              <div class="notif-time">
                {{ n.created_at | date:'short' }}
              </div>
            </div>

          </div>

        </div>

        <!-- Logout -->
        <button class="action-btn logout-btn" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>

      </div>
    </header>

    <!-- CONTENT -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <!-- CHAT -->
    <button class="chat-fab" (click)="toggleMiniChat()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="chat-badge" *ngIf="chatUnread">
        {{ chatUnread }}
      </span>
    </button>

  </div>
</div>
