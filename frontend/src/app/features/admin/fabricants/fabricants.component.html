<div class="page">
  <div class="page-header">
    <h3>Gestion des fabricants</h3>
    <div class="actions"><button class="btn-primary" (click)="add()">+ Ajouter</button></div>
  </div>
  <div *ngIf="fabricants.length === 0">Aucun fabricant trouvé.</div>
  <ul>
    <li *ngFor="let f of fabricants">
      {{ f.name }}
      <button (click)="edit(f)">✏️</button>
      <button (click)="remove(f)">🗑️</button>
    </li>
  </ul>
</div>
