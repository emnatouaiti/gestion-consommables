<div class="cr-container">

  <div class="cr-header">
    <div class="cr-header-left">
      <div class="cr-header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        </svg>
      </div>
      <div>
        <h1>Gestion des modèlesgggggg</h1>
        <div class="cr-subtitle">Référentiel · Modèles de matériel</div>
      </div>
    </div>
    <div class="cr-header-right">
      <button class="cr-btn-new" (click)="add()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Ajouter un modèle
      </button>
    </div>
  </div>

  <div class="cr-filter-bar">
    <div class="cr-filter-group">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <select [(ngModel)]="selectedFabricant" (change)="load()">
        <option [ngValue]="null">Tous les fabricants</option>
        <option *ngFor="let f of fabricants" [ngValue]="f.id">{{ f.name }}</option>
      </select>
    </div>
    <div class="cr-filter-group">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <select [(ngModel)]="selectedMarque" (change)="load()">
        <option [ngValue]="null">Toutes les marques</option>
        <option *ngFor="let m of marques" [ngValue]="m.id">{{ m.name }}</option>
      </select>
    </div>
    <span class="cr-count">{{ modeles.length }} modèle(s)</span>
  </div>

  <div class="cr-section">

    <div *ngIf="modeles.length === 0" class="cr-empty">
      <span class="cr-spinner"></span>
      Aucun modèle trouvé.
    </div>

    <div *ngIf="modeles.length > 0" class="cr-table-wrap">
      <table class="cr-table">
        <thead>
          <tr>
            <th>Nom du modèle</th>
            <th>Marque</th>
            <th style="text-align:center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let mo of modeles">
            <td class="cr-td-main">{{ mo.name }}</td>
            <td>
              <span *ngIf="mo.marque_id" class="cr-tag cr-tag--neutral">{{ mo.marque_id }}</span>
              <span *ngIf="!mo.marque_id" class="cr-sub--mini">—</span>
            </td>
            <td>
              <div class="cr-td-actions" style="justify-content:center">
                <button class="cr-btn cr-btn--edit" (click)="edit(mo)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Modifier
                </button>
                <button class="cr-btn cr-btn--danger-icon" (click)="remove(mo)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="cr-table-footer">
        <span>{{ modeles.length }} modèle(s) affiché(s)</span>
      </div>
    </div>

  </div>
</div>
