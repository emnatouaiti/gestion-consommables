<div class="page">
  <div class="page-header">
    <h3>Gestion des modèles</h3>
    <div class="actions"><button class="btn-primary" (click)="add()">+ Ajouter</button></div>
  </div>

  <div style="margin-bottom:8px;">
    <label>Fabricant:</label>
    <select [(ngModel)]="selectedFabricant" (change)="load()">
      <option [ngValue]="null">Tous</option>
      <option *ngFor="let f of fabricants" [ngValue]="f.id">{{ f.name }}</option>
    </select>
    <label style="margin-left:12px;">Marque:</label>
    <select [(ngModel)]="selectedMarque" (change)="load()">
      <option [ngValue]="null">Toutes</option>
      <option *ngFor="let m of marques" [ngValue]="m.id">{{ m.name }}</option>
    </select>
  </div>

  <div *ngIf="modeles.length === 0">Aucun modèle trouvé.</div>
  <ul>
    <li *ngFor="let mo of modeles">
      {{ mo.name }} <small *ngIf="mo.marque_id">(marque: {{ mo.marque_id }})</small>
      <button (click)="edit(mo)">✏️</button>
      <button (click)="remove(mo)">🗑️</button>
    </li>
  </ul>
</div>
